name: Deploy Pass'âge (v03 PWA) to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install build dependencies
        run: npm install --prefix 03-version-pwa

      - name: Build content.js from YAML sources
        run: node 03-version-pwa/build.js

      - name: Upload PWA artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 03-version-pwa

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
