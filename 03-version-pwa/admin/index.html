<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Back-office Pass'âge</title>
  <meta name="description" content="Back-office local pour gérer les fiches de Pass'âge." />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="page-shell">
    <header class="admin-header">
      <div>
        <p class="page-pretitle">Back-office</p>
        <h1>Back-office Pass'âge</h1>
        <p class="warning">Cet espace est un outil local de préparation. Il ne doit pas être utilisé par les jeunes.</p>
      </div>
      <div class="top-buttons">
        <button id="newBtn" type="button">Nouvelle fiche</button>
        <button id="exportBtn" type="button">Exporter JSON</button>
        <button id="importBtn" type="button">Importer JSON</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden />
      </div>
    </header>

    <main class="admin-main">
      <section class="list-panel">
        <div class="panel-head">
          <h2>Liste des fiches</h2>
          <p class="panel-subtitle">Clique sur une fiche pour la modifier.</p>
        </div>
        <div id="listEmpty" class="empty-state">Aucune fiche enregistrée.</div>
        <ul id="fichesList" class="fiches-list" aria-label="Liste des fiches"></ul>
      </section>

      <section class="editor-panel">
        <div class="panel-head">
          <h2 id="editorTitle">Ajouter une fiche</h2>
          <p class="panel-subtitle">Formulaire de gestion des fiches Pass'âge.</p>
        </div>

        <form id="ficheForm">
          <input id="ficheId" name="id" type="hidden" />
          <div class="field-group">
            <label for="title">Titre</label>
            <input id="title" name="title" type="text" required maxlength="120" placeholder="Titre de la fiche" />
          </div>
          <div class="field-group">
            <label for="category">Catégorie</label>
            <select id="category" name="category" required>
              <option value="">Sélectionner une catégorie</option>
              <option value="argent">argent</option>
              <option value="logement">logement</option>
              <option value="travail">travail</option>
              <option value="sante">sante</option>
              <option value="administratif">administratif</option>
              <option value="etudes">etudes</option>
              <option value="vie-pratique">vie-pratique</option>
              <option value="loisirs">loisirs</option>
              <option value="urgence">urgence</option>
              <option value="famille">famille</option>
            </select>
          </div>
          <div class="field-group">
            <label for="summary">Résumé</label>
            <textarea id="summary" name="summary" rows="3" maxlength="280" placeholder="Résumé court de la fiche"></textarea>
          </div>
          <div class="field-group">
            <label for="content">Contenu</label>
            <textarea id="content" name="content" rows="8" placeholder="Contenu de la fiche, texte HTML ou texte brut"></textarea>
          </div>
          <div class="field-group">
            <label for="source">Source</label>
            <input id="source" name="source" type="text" maxlength="200" placeholder="Source à vérifier" />
          </div>
          <div class="field-group">
            <label for="lastChecked">Dernière vérification</label>
            <input id="lastChecked" name="lastChecked" type="text" maxlength="80" placeholder="Mai 2026" />
          </div>
          <div class="field-group">
            <label for="disclaimer">Mention de prudence</label>
            <textarea id="disclaimer" name="disclaimer" rows="3" maxlength="260" placeholder="Cette fiche est un repère général..."></textarea>
          </div>
          <div class="field-group">
            <label for="status">Statut</label>
            <select id="status" name="status" required>
              <option value="">Sélectionner un statut</option>
              <option value="brouillon">brouillon</option>
              <option value="à relire">à relire</option>
              <option value="validée">validée</option>
              <option value="publiée">publiée</option>
              <option value="à mettre à jour">à mettre à jour</option>
            </select>
          </div>
          <div class="field-group">
            <label for="reviewedBy">Relu par</label>
            <input id="reviewedBy" name="reviewedBy" type="text" maxlength="120" placeholder="Nom de la personne qui a relu" />
          </div>
          <div class="field-group">
            <label for="updatedBy">Mis à jour par</label>
            <input id="updatedBy" name="updatedBy" type="text" maxlength="120" placeholder="Nom de la personne ayant mis à jour" />
          </div>
          <div class="field-group">
            <label for="internalNotes">Notes internes</label>
            <textarea id="internalNotes" name="internalNotes" rows="4" maxlength="300" placeholder="Notes qui ne seront pas visibles dans l'app jeune"></textarea>
          </div>
          <div class="field-row field-archived">
            <label for="archived"><input id="archived" name="archived" type="checkbox" /> Archivée</label>
          </div>

          <div class="form-actions">
            <button id="saveBtn" type="submit">Enregistrer</button>
            <button id="archiveBtn" type="button">Archiver</button>
            <button id="deleteBtn" type="button" class="danger">Supprimer</button>
            <button id="resetBtn" type="button" class="ghost">Réinitialiser</button>
          </div>
        </form>
        <div id="message" class="message" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
