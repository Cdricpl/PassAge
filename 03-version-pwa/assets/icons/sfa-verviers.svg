<!-- Service Familles d'Accueil — Verviers
     Approximation libre du vrai logo (maison orange + soleil + cœurs).
     Remplace ce fichier par le PNG/SVG officiel pour la prod. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Service Familles d'Accueil — Verviers">
  <!-- Soleil en haut à gauche -->
  <g transform="translate(15, 10)">
    <circle cx="10" cy="10" r="6" fill="#F4B324"/>
    <g stroke="#F4B324" stroke-width="2" stroke-linecap="round">
      <line x1="10" y1="0" x2="10" y2="3"/>
      <line x1="10" y1="17" x2="10" y2="20"/>
      <line x1="0" y1="10" x2="3" y2="10"/>
      <line x1="17" y1="10" x2="20" y2="10"/>
      <line x1="3" y1="3" x2="5" y2="5"/>
      <line x1="15" y1="15" x2="17" y2="17"/>
      <line x1="3" y1="17" x2="5" y2="15"/>
      <line x1="15" y1="5" x2="17" y2="3"/>
    </g>
  </g>

  <!-- Cœurs en haut à droite -->
  <g transform="translate(80, 10)" fill="#E27D7D">
    <path d="M8 12 C8 8, 4 6, 4 9 C4 11, 8 14, 8 14 C8 14, 12 11, 12 9 C12 6, 8 8, 8 12 z"/>
    <path d="M18 18 C18 15, 15 14, 15 16 C15 18, 18 20, 18 20 C18 20, 21 18, 21 16 C21 14, 18 15, 18 18 z" opacity="0.85"/>
  </g>

  <!-- Toit (orange foncé) -->
  <path d="M20 65 L60 35 L100 65 Z" fill="#E8923D"/>

  <!-- Maison (corps orange clair) -->
  <path d="M28 62 L60 42 L92 62 L92 95 Q92 98 89 98 L31 98 Q28 98 28 95 Z" fill="#F4B45E"/>

  <!-- Porte (rose/rouge) -->
  <path d="M50 75 Q50 70 55 70 L65 70 Q70 70 70 75 L70 95 L50 95 Z" fill="#C8456A"/>

  <!-- Sol/herbe -->
  <ellipse cx="60" cy="100" rx="50" ry="6" fill="#7B5547" opacity="0.4"/>
</svg>
