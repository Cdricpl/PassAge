mission: >-
  Trop d'infos utiles pour les jeunes majeur·es sont cachées dans du jargon
  administratif. Pass'âge rassemble l'essentiel : devenir majeur·e, papiers,
  argent, logement, travail, études, santé, vie quotidienne, urgences. Tu lis,
  tu prends ce qui t'aide, tu refermes.

service:
  name: "Service Familles d'Accueil de Verviers"
  url: "https://famillesdaccueil.mypixieset.com/"
  description: >-
    Pass'âge est née au Service Familles d'Accueil de Verviers, qui accompagne
    depuis des années les jeunes en placement et leurs familles d'accueil. Sa
    porte te reste ouverte après tes 18 ans : pour une question, un doute, une
    écoute.

contact:
  email: "cpi@famillesaccueil.be"

