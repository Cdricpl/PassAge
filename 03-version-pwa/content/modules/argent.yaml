id: argent
title: Argent & aides
subtitle: Mes revenus, mes aides, mon budget
color: argent
icon: euro
objective: Comprendre ce que tu peux toucher, mieux gérer ton argent, savoir où demander de l'aide.
source: mi-is.be (SPP Intégration sociale) · inforjeunes.be
sections:
  - id: ris-cpas
    title: Le RIS et le CPAS
    summary: Comment l'obtenir, conditions, contrat d'intégration.
    lastChecked: 05/07/2026
    body: |-
      <p>Le <strong>RIS</strong> (revenu d'intégration sociale) est une aide financière versée par le CPAS de ta commune, si tes ressources ne suffisent pas pour vivre.</p>

      <h2>Les conditions</h2>
      <ul>
        <li>Avoir 18 ans accomplis.</li>
        <li>Ne pas avoir de ressources suffisantes pour vivre.</li>
        <li>Accepter de signer un <strong>PIIS</strong> (projet individualisé d'intégration sociale) avec un·e travailleur·euse social·e du CPAS (objectifs scolarité, emploi…) — obligatoire si tu as moins de 25 ans.</li>
      </ul>

      <h2>Comment ça se passe ?</h2>
      <ol class="fiche-ol">
        <li>Tu prends rendez-vous au CPAS de ta commune de domicile.</li>
        <li>Une enquête sociale est faite (sur ta situation, parfois sur tes parents).</li>
        <li>Le montant est fixé en fonction (vis seul·e, en colocation…).</li>
        <li>Tu signes le PIIS, et le RIS est versé chaque mois.</li>
      </ol>

      <div class="callout warn"><div><strong>Attention si tu travailles</strong>Si tu fais un job étudiant ou un job ponctuel, ton RIS peut être <strong>partiellement réduit</strong> ce mois-là. Renseigne-toi à l'avance, une exonération existe.</div></div>

      <h2>Aides ponctuelles</h2>
      <p>Le CPAS peut aussi t'aider de manière ponctuelle (aide alimentaire, garantie locative, aide médicale urgente). Ces aides sont parfois remboursables.</p>

      <div class="callout info"><div><strong>Si tu as été accueilli·e en famille d'accueil ou en institution</strong>Ton statut d'enfant accueilli te donne un accès facilité au RIS. Explique ta situation au CPAS — et retrouve tous tes droits spécifiques dans <a href="#/module/placement">Après le placement</a>.</div></div>
  - id: allocations-familiales
    title: Mes allocations familiales
    summary: Qui les reçoit, jusqu'à quand, et les démarches à faire.
    lastChecked: 06/07/2026
    body: |
      <p>En Wallonie, les allocations familiales sont gérées par la <strong>caisse publique FAMIWAL</strong> (ou par une caisse privée si tu en as choisi une avant). À 18 ans, plusieurs choses changent.</p>

      <h2>Qui reçoit l'argent ?</h2>
      <ul>
        <li>Avoir 18 ans ne suffit pas : les allocations restent versées à <strong>la personne qui t'élève</strong> (parent, famille d'accueil…).</li>
        <li>Elles arrivent <strong>directement sur ton compte</strong> si tu es <strong>domicilié·e à une autre adresse</strong> que la personne qui t'élève (possible dès 16 ans — c'est le cas si tu es mis·e en autonomie), si tu es marié·e ou émancipé·e, ou si tu es toi-même allocataire pour ton enfant.</li>
      </ul>

      <h2>Jusqu'à quand ?</h2>
      <ul>
        <li>Jusqu'à <strong>21 ans</strong> : sans condition d'études (sauf si tu touches un revenu de remplacement ou dépasses les limites de travail).</li>
        <li>De 21 à <strong>25 ans</strong> : si tu poursuis des études (au moins <strong>27 crédits par année académique</strong> dans le supérieur, ou enseignement secondaire à temps plein).</li>
        <li>Si tu termines ou interromps tes études : tu peux les garder encore <strong>12 mois maximum</strong>. Attention, la règle change au <strong>1er juillet 2026</strong> : un nouveau statut « post-étudiant » remplace l'ancien système des 360 jours de stage d'insertion — vérifie ta situation auprès de FAMIWAL (voir aussi <a href="#/fiche/travail/chomage">Le chômage après les études</a>).</li>
      </ul>

      <h2>Démarches à faire</h2>
      <ol class="fiche-ol">
        <li>Si tu es dans un des cas où l'argent te revient directement : communique ton <strong>numéro de compte (IBAN)</strong> à FAMIWAL ou à ta caisse via <a href="https://www.myfamiwal.be" target="_blank" rel="noopener">myFAMIWAL</a> (connexion via itsme).</li>
        <li>Si tu déménages : signale ton <strong>changement d'adresse</strong>.</li>
        <li>Si tu es aux études : tu n'as souvent rien à faire — l'info est transmise par ton école.</li>
      </ol>

      <h2>Le quota du job étudiant</h2>
      <p>Tu peux travailler jusqu'à <strong>650 heures par an</strong> sous contrat étudiant <strong>sans</strong> perdre tes allocations familiales (en Wallonie, jusqu'à 25 ans). Au-delà des 650 h, tu peux encore prester <strong>240 h par trimestre</strong> comme salarié·e ordinaire ; si tu dépasses aussi cette limite, tu perds les allocations pour <strong>le trimestre entier</strong>. <strong>Exception</strong> : en juillet-août-septembre, si tu reprends les cours à la rentrée, tu peux travailler <strong>sans limite d'heures</strong>. Voir <a href="#/fiche/travail/job-etudiant">Le job étudiant</a>.</p>

      <h2>Bon à savoir</h2>
      <ul>
        <li>Si tu as un enfant, tu touches aussi <strong>ses</strong> allocations familiales.</li>
        <li>Tu peux les <strong>cumuler avec un salaire</strong> (dans les limites ci-dessus). Attention : si tu touches le <strong>RIS</strong> et que les allocations te sont versées à toi, elles comptent comme ressources et sont <strong>déduites du RIS</strong> (sauf celles de tes propres enfants).</li>
        <li>Les allocations familiales <strong>ne sont pas taxables</strong> — pas besoin de les déclarer aux impôts.</li>
      </ul>

      <div class="callout info"><div><strong>Si tu as été accueilli·e en famille d'accueil ou en institution</strong>Vérifie aussi le compte d'épargne peut-être ouvert à ton nom par l'autorité mandante. Voir <a href="#/fiche/placement/epargne-mandante">Le compte d'épargne mandant</a>.</div></div>

      <h2>Pour aller plus loin</h2>
      <ul>
        <li><a href="https://www.famiwal.be" target="_blank" rel="noopener">famiwal.be</a> — caisse publique wallonne</li>
        <li><a href="https://www.aviq.be/familles" target="_blank" rel="noopener">AVIQ Familles</a> — info officielle Wallonie</li>
        <li><a href="https://inforjeunes.be/thematique/allocations-familiales/" target="_blank" rel="noopener">Inforjeunes — FAQ allocations familiales</a></li>
      </ul>
  - id: compte-bancaire
    title: Le compte bancaire
    summary: Ouvrir un compte, ordres permanents, épargne.
    lastChecked: 11/06/2026
    source: febelfin.be · inforjeunes.be
    body: |
      <p>À 18 ans, tu peux ouvrir un compte en banque à ton nom. C'est indispensable pour recevoir un salaire, payer en magasin, ou recevoir tes aides.</p>

      <h2>Comment ouvrir un compte</h2>
      <p>Tu as deux options :</p>
      <ol class="fiche-ol">
        <li><strong>En ligne</strong> : la plupart des banques proposent une ouverture de compte en quelques minutes via leur site ou appli. Tu auras besoin de ta carte d'identité (photo) et d'un selfie pour vérifier ton identité.</li>
        <li><strong>En agence</strong> : tu te présentes avec ta carte d'identité. Un conseiller ouvre le compte sur place.</li>
      </ol>

      <h2>Ce qu'il te faut</h2>
      <ul>
        <li>Ta <strong>carte d'identité</strong> (obligatoire).</li>
        <li>Parfois : une <strong>preuve de domicile</strong> (facture, attestation commune) — pas toujours demandée.</li>
        <li>Un <strong>numéro de téléphone</strong> pour activer l'appli et les codes.</li>
      </ul>

      <h2>Comptes gratuits pour les jeunes</h2>
      <p>Toutes les grandes banques (BNP Paribas Fortis, Belfius, ING, KBC/CBC, Argenta, Keytrade…) proposent un <strong>compte jeune sans frais</strong> — gratuit jusqu'à 24, 25 ou 27 ans selon la banque. Certaines (Argenta, Keytrade) restent gratuites à tout âge.</p>
      <p>Les noms et conditions des comptes changent souvent : compare les services (carte de débit, appli, retraits gratuits en Belgique) sur les sites des banques ou via <a href="https://www.wikifin.be" target="_blank" rel="noopener">Wikifin</a> (comparateur officiel et neutre) avant de choisir.</p>

      <h2>Le droit au compte de base</h2>
      <p>Si une banque te refuse, tu as le droit à un <strong>compte de base</strong> — c'est garanti par la loi belge. Demande à n'importe quelle grande banque ou renseigne-toi auprès de <a href="https://www.febelfin.be" target="_blank" rel="noopener">Febelfin</a> (fédération des banques).</p>

      <h2>Activer itsme dès que possible</h2>
      <p>Dès l'ouverture du compte, active <strong>itsme</strong> (l'identité numérique belge). Tu en auras besoin pour : Tax-on-Web (impôts), myFAMIWAL (allocations), e-services gouvernementaux, certaines banques en ligne.</p>

      <h2>Le compte courant — ce que tu peux faire</h2>
      <ul>
        <li>Recevoir tes revenus (salaire, allocations, RIS).</li>
        <li>Faire des virements et payer en magasin.</li>
        <li>Mettre en place des <strong>domiciliations</strong> (factures qui partent automatiquement).</li>
        <li>Faire des <strong>ordres permanents</strong> (ex : loyer payé chaque mois sans y penser).</li>
      </ul>

      <h2>Le compte épargne</h2>
      <p>À associer à ton compte courant pour mettre de côté (projet, coup dur). Il rapporte un petit intérêt.</p>

      <h2>L'application mobile</h2>
      <p>Très pratique : tu vois tes finances en temps réel, tu fais tes virements en quelques clics. Toutes les banques en proposent une.</p>

      <div class="callout tip"><div><strong>Astuce</strong>Beaucoup de banques proposent un compte gratuit pour les jeunes. Compare avant de choisir — les services (retraits, carte, appli) varient selon les établissements.</div></div>
  - id: aides-supp
    title: 'Bons plans : tarif social, seconde main'
    summary: Tarif social énergie/internet, magasins de seconde main.
    lastChecked: 06/07/2026
    body: |
      <p>Plein d'aides et d'astuces existent en plus du RIS pour te faciliter la vie. Voici les plus utiles.</p>

      <h2>Tarif social pour l'énergie</h2>
      <p>Si tu touches le <strong>RIS du CPAS</strong>, certaines allocations handicap, ou la garantie de revenus aux personnes âgées, tu as droit au <strong>tarif social</strong> pour&nbsp;:</p>
      <ul>
        <li><strong>Électricité, gaz naturel, chaleur</strong> : tarif identique partout en Belgique, peu importe ton fournisseur.</li>
      </ul>
      <p>Pour l'<strong>eau</strong>, il n'existe pas de tarif social en Wallonie — mais le <strong>Fonds social de l'eau</strong> peut intervenir si tu as du mal à payer ta facture. Demande au CPAS.</p>
      <p>Demande à <strong>ton·ta intervenant·e social·e du CPAS</strong> de faire la démarche pour toi. Souvent, c'est <strong>automatique</strong> dès que tu es au RIS — mais vérifie.</p>

      <h2>Offre Internet sociale (19 €/mois)</h2>
      <p>Si tu touches le RIS, l'aide sociale du CPAS, la GRAPA, ou une <strong>allocation pour personne en situation de handicap</strong>, tu as droit à une <strong>offre internet sociale</strong> à <strong>19 € par mois maximum</strong>, avec :</p>
      <ul>
        <li><strong>30 Mbps</strong> minimum de débit.</li>
        <li><strong>150 Go</strong> de téléchargement inclus.</li>
        <li>En Wallonie : chez <strong>Proximus</strong> et <strong>VOO</strong> (Telenet la propose en Flandre).</li>
      </ul>
      <p>Demande directement à l'opérateur, ou vérifie ton éligibilité via le <a href="https://economie.fgov.be/fr/themes/line/telecommunications/offre-internet-sociale" target="_blank" rel="noopener">SPF Économie</a>.</p>

      <h2>Et la téléphonie&nbsp;?</h2>
      <p>L'ancien <strong>tarif social téléphonique</strong> a été <strong>supprimé le 1er mars 2024</strong> — il est remplacé par l'offre internet sociale ci-dessus. Si tu en bénéficiais avant cette date, tu peux le conserver. Infos : <a href="https://www.ibpt.be/consommateurs/tarif-social" target="_blank" rel="noopener">IBPT</a> (régulateur télécom).</p>

      <h2>Magasins de seconde main</h2>
      <p>Pour t'équiper sans te ruiner&nbsp;:</p>
      <ul>
        <li>ASBL et <strong>magasins de seconde main</strong> dans chaque ville (vêtements, meubles, électroménager). Demande à ta commune ou ton CPAS pour la liste locale.</li>
        <li><strong>Ressourceries</strong> (style Les Petits Riens, Oxfam, Terre, La Bourse aux Vêtements).</li>
      </ul>

      <h2>Sites de seconde main</h2>
      <ul>
        <li><a href="https://www.2ememain.be" target="_blank" rel="noopener">2ememain.be</a> — meubles, électroménager, divers</li>
        <li><a href="https://www.facebook.com/marketplace" target="_blank" rel="noopener">Facebook Marketplace</a> — local, négociable</li>
        <li><a href="https://www.vinted.be" target="_blank" rel="noopener">Vinted</a> — vêtements</li>
        <li><a href="https://www.toogoodtogo.be" target="_blank" rel="noopener">Too Good To Go</a> — paniers anti-gaspi à prix cassés</li>
      </ul>

      <div class="callout tip"><div><strong>L'aide alimentaire, c'est un droit</strong>Restos du Cœur, épiceries sociales, frigos solidaires, paniers anti-gaspi : tout est expliqué dans <a href="#/fiche/vie/alimentation">Alimentation : manger bien sans se ruiner</a>.</div></div>

      <h2>Pour aller plus loin</h2>
      <ul>
        <li><a href="#/fiche/argent/ris-cpas">Le RIS et le CPAS</a> — comment accéder à ces tarifs sociaux</li>
        <li><a href="#/fiche/argent/budget">Mon budget mensuel</a> — gérer ses dépenses prioritaires</li>
        <li><a href="https://economie.fgov.be/fr/themes/line/telecommunications/offre-internet-sociale" target="_blank" rel="noopener">SPF Économie</a> — offre internet sociale officielle</li>
        <li><a href="https://www.ecoconso.be" target="_blank" rel="noopener">ecoconso.be</a> — conseils pour réduire sa consommation</li>
      </ul>
  - id: budget
    title: Mon budget mensuel
    summary: Dépenses obligatoires, priorités, astuces pour ne pas se planter.
    lastChecked: 11/06/2026
    body: |
      <p>Avant de prendre un logement ou un engagement, prends 10 minutes pour faire ton budget mensuel. Tu poses tes <strong>rentrées</strong> (RIS, salaire, allocations…) et tes <strong>dépenses fixes</strong>. Le reste, c'est ce que tu peux dépenser ou épargner.</p>

      <h2>Dépenses fixes — par ordre de priorité</h2>
      <p>Ne paie <strong>jamais</strong> tes loisirs avant tes dépenses obligatoires. Voici l'ordre :</p>
      <ol class="fiche-ol">
        <li><strong>Loyer</strong> — astuce : tu peux demander au <a href="#/fiche/argent/ris-cpas">CPAS</a> de payer ton loyer directement au propriétaire (il te reverse le solde du RIS). Ça évite les oublis.</li>
        <li><strong>Énergie</strong> (eau, électricité, gaz) — provision mensuelle + décompte annuel. Voir <a href="#/fiche/logement/compteurs">L'ouverture des compteurs</a>.</li>
        <li><strong>Assurance habitation</strong> (souvent obligatoire dans le <a href="#/fiche/logement/bail">bail</a>). Voir <a href="#/fiche/logement/assurance-habitation">L'assurance habitation</a>.</li>
        <li><strong>Cotisation mutuelle</strong> — tu peux payer mensuellement ou annuellement. Voir <a href="#/fiche/admin/mutuelle">La mutuelle</a>.</li>
        <li><strong>Téléphone &amp; internet</strong> — voir aussi <a href="#/fiche/argent/aides-supp">tarif social internet</a>.</li>
        <li><strong>Transport</strong> (TEC, SNCB, carburant, vélo).</li>
        <li><strong>Impôts/taxes</strong> (taxe communale, taxe poubelles…) — souvent annuelles.</li>
      </ol>

      <h2>Astuces pour ne pas oublier</h2>
      <ul>
        <li><strong>Domiciliations bancaires</strong> : ton loyer, ta mutuelle et tes factures partent automatiquement chaque mois. Plus d'oublis.</li>
        <li><strong>Ordres permanents</strong> : pareil, mais pour des montants fixes (ex : virer 30 € sur ton compte épargne chaque mois).</li>
        <li><strong>Une farde papier</strong> ou des dossiers sur ton ordi pour classer tes contrats, factures, fiches de paie. Tu te remercieras dans 3 ans.</li>
      </ul>

      <h2>Dépenses variables</h2>
      <ul>
        <li><strong>Courses</strong> : ~200–300 €/mois pour 1 personne (voir <a href="#/fiche/vie/alimentation">Alimentation</a> pour les bons plans).</li>
        <li>Vêtements, hygiène, loisirs.</li>
        <li>Imprévus (médicaments, dépannages…).</li>
      </ul>

      <h2>L'idéal — épargner un peu chaque mois</h2>
      <p>Même 20 € par mois, c'est 240 € au bout d'un an : de quoi faire face à un coup dur (caution déposée pour un nouveau logement, panne d'électroménager, frais de santé inattendus).</p>

      <div class="callout warn"><div><strong>Si tu n'arrives pas à payer tes factures</strong>N'attends pas. Parle-en au CPAS, à ton AMO, ou au <a href="https://www.sdj.be" target="_blank" rel="noopener">Service Droit des Jeunes</a>. Il existe des solutions (plan de paiement, médiation de dettes…). Plus tu attends, plus c'est compliqué.</div></div>

      <h2>N'oublie pas en cas de déménagement</h2>
      <p>Un déménagement impacte ton budget et tes organismes à prévenir. La liste complète est dans <a href="#/fiche/logement/changement-adresse">Changer d'adresse</a>.</p>

      <div class="callout tip"><div><strong>Demande de l'aide</strong>Le CPAS, Inforjeunes ou une AMO peuvent t'aider à faire ton budget <strong>gratuitement et sans jugement</strong>. Tu peux aussi voir <a href="#/fiche/argent/aides-supp">Bons plans : tarif social, seconde main</a>.</div></div>

      <h2>Pour aller plus loin</h2>
      <ul>
        <li><a href="#/fiche/argent/ris-cpas">Le RIS et le CPAS</a> — si tes revenus ne couvrent pas le minimum</li>
        <li><a href="#/fiche/argent/aides-supp">Bons plans : tarif social, seconde main</a> — réduire les factures</li>
        <li><a href="#/fiche/logement/aides">Les aides au logement</a> — garantie locative, ADeL</li>
        <li><a href="https://www.sdj.be" target="_blank" rel="noopener">Service Droit des Jeunes</a> — aide gratuite pour les dettes et difficultés financières</li>
      </ul>
  - id: dettes
    title: "Dettes : que faire quand tu ne peux pas payer"
    summary: "Rappels, huissiers, médiation de dettes gratuite : tes droits et les bons réflexes."
    lastChecked: "11/06/2026"
    source: "observatoire-credit.be · economie.fgov.be"
    body: |
      <p>Une facture que tu ne peux pas payer, ça arrive — surtout quand on démarre dans la vie. La pire chose à faire : <strong>l'ignorer</strong>. Voici tes droits et les bons réflexes, étape par étape.</p>
      
      <h2>Réflexe n°1 : réagis tout de suite</h2>
      <ul>
        <li><strong>Contacte le créancier</strong> (magasin, fournisseur, propriétaire…) dès que tu sais que tu ne pourras pas payer. Propose un <strong>plan de paiement</strong> (payer en plusieurs fois). Beaucoup acceptent.</li>
        <li>Garde une <strong>trace écrite</strong> de tout (mails, courriers).</li>
      </ul>
      
      <h2>Tes droits depuis 2023</h2>
      <p>La loi protège les consommateurs contre les frais abusifs :</p>
      <ul>
        <li>Le <strong>premier rappel est gratuit</strong> — aucun frais ne peut t'être facturé.</li>
        <li>Tu as ensuite <strong>14 jours</strong> pour payer avant tout frais supplémentaire.</li>
        <li>Les frais de retard sont <strong>plafonnés par la loi</strong>.</li>
        <li>Tu peux <strong>contester</strong> une dette que tu estimes injustifiée — fais-le par écrit.</li>
      </ul>
      
      <h2>L'huissier de justice</h2>
      <ul>
        <li>Un courrier d'huissier n'est pas une saisie : à ce stade, tu peux encore <strong>négocier un plan de paiement</strong>.</li>
        <li>Une <strong>saisie</strong> n'est possible qu'après un <strong>jugement</strong> du tribunal (sauf exceptions, comme certaines dettes fiscales).</li>
        <li>Ne signe rien sous pression — demande d'abord conseil (gratuit, voir ci-dessous).</li>
      </ul>
      
      <h2>La médiation de dettes — gratuite</h2>
      <p>Si tu as plusieurs dettes et que tu ne t'en sors plus, un <strong>service de médiation de dettes agréé</strong> peut négocier avec tes créanciers à ta place et mettre en place un plan réaliste.</p>
      <ul>
        <li><strong>Gratuit</strong>, via ton <strong>CPAS</strong> ou un des 200+ services agréés en Wallonie.</li>
        <li>Pour les situations graves, le <strong>règlement collectif de dettes</strong> (via le tribunal) gèle les intérêts et organise un plan global avec tous tes créanciers.</li>
      </ul>
      
      <h2>Dettes d'énergie (gaz, électricité)</h2>
      <p>Des protections spécifiques existent : plan de paiement, intervention du CPAS, fournisseur social. Ne laisse pas la situation pourrir — contacte ton fournisseur et ton CPAS dès le premier impayé. Voir <a href="#/fiche/logement/compteurs">la fiche compteurs et énergie</a>.</p>
      
      <div class="callout tip"><div><strong>Pas de honte, pas de panique</strong>Des milliers de personnes passent par la médiation de dettes chaque année. Plus tu agis tôt, plus c'est simple à régler. Demander de l'aide est un droit, pas un échec.</div></div>
      
      <h2>Qui peut m'aider ?</h2>
      <ul>
        <li><strong>Ton CPAS</strong> — médiation de dettes gratuite.</li>
        <li><a href="https://www.observatoire-credit.be" target="_blank" rel="noopener">Observatoire du Crédit et de l'Endettement</a> — conseils juridiques gratuits : 071 33 12 59.</li>
        <li>Le <a href="https://www.sdj.be" target="_blank" rel="noopener">Service Droit des Jeunes</a> — pour comprendre ou contester un courrier.</li>
      </ul>
      
      <h2>Pour aller plus loin</h2>
      <ul>
        <li><a href="https://economie.fgov.be/fr/themes/services-financiers/endettement/reglement-collectif-de-dettes" target="_blank" rel="noopener">SPF Économie — règlement collectif de dettes</a></li>
        <li><a href="#/fiche/argent/budget">Mon budget mensuel</a> — éviter d'en arriver là</li>
        <li><a href="#/fiche/admin/aide-juridique">Avocat prodéo et aide juridique</a> — si ça va jusqu'au tribunal</li>
      </ul>
